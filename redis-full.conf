# redis-full.conf — Redis core + every bundled module's tunables.
#
# Layout: this file `include`s `redis.conf` (core) and each module's own
# `src/module.conf` (its tunables, all commented defaults). The
# `loadmodule` directive for a module is emitted just before its
# `include`, so the module registers its config keys before the included
# file is parsed.
#
# Single source of truth for each module's tunables is the module's
# upstream `src/module.conf` — do NOT copy tunables into this file.
#
# Run from the repo root (Redis resolves `include` paths relative to the
# server's working directory, not the conf file's directory):
#   ./src/redis-server redis-full.conf

include redis.conf

loadmodule ./modules/redisbloom/redisbloom.so
include modules/redisbloom/src/module.conf

loadmodule ./modules/redisearch/redisearch.so
include modules/redisearch/src/module.conf

loadmodule ./modules/redisjson/rejson.so
include modules/redisjson/src/module.conf

loadmodule ./modules/redistimeseries/redistimeseries.so
include modules/redistimeseries/src/module.conf

################################## SECURITY ###################################
#
# The following is a list of command categories and their meanings:
#
# * search     - Query engine related.
# * json       - Data type: JSON related.
# * timeseries - Data type: time series related.
# * bloom      - Data type: Bloom filter related.
# * cuckoo     - Data type: cuckoo filter related.
# * topk       - Data type: top-k related.
# * cms        - Data type: count-min sketch related.
# * tdigest    - Data type: t-digest related.
