# modules.yaml — release manifest for bundled Redis modules.
#
# Single source of truth for which upstream repo and ref each module is
# pinned to. Consumed by:
#   - `make modules-install` (top-level Makefile) to clone/refresh sources
#     under modules/<name>/src/
#   - modules/common.mk's per-module clone-on-build fallback
#   - `make tarball` to clone modules at their pinned ref into the
#     release source tarball
#
# To bump a module: edit `version` (tag/branch) and/or `commit` (exact SHA;
# takes precedence over `version` when non-empty), then run
# `make modules-install <name>` to refresh the local clone.
#
# Format (kept deliberately simple so a small awk helper can parse it without
# needing yq/python; see modules/manifest.mk):
#   modules:
#     - name: <module-name>            # directory under modules/
#       repo: <git URL>
#       version: <tag-or-branch>       # required if `commit` is empty
#       commit: <sha-or-empty>         # optional; wins over `version`
#       loadmodule: <path-to-.so>      # used by `make modules-install` to
#                                      # rewrite the auto-managed block in
#                                      # redis.conf; the .so basename does not
#                                      # always match the module name (e.g.
#                                      # redisjson produces rejson.so).
#
# Notes:
#   - `vector-sets` is intentionally absent — it lives in-tree under
#     modules/vector-sets/ and is not cloned.
#   - No inline comments after values; one field per line.

modules:
  - name: redisbloom
    repo: https://github.com/redisbloom/redisbloom
    version: tal.ba/feat/make_set_up
    commit:
    loadmodule: ./modules/redisbloom/redisbloom.so
  - name: redisearch
    repo: https://github.com/redisearch/redisearch
    version: v8.7.90
    commit:
    loadmodule: ./modules/redisearch/redisearch.so
  - name: redisjson
    repo: https://github.com/redisjson/redisjson
    version: tal.ba/feat/make_setup_new
    commit:
    loadmodule: ./modules/redisjson/rejson.so
  - name: redistimeseries
    repo: https://github.com/redistimeseries/redistimeseries
    version: tal.ba/feat/make_setup_new
    commit:
    loadmodule: ./modules/redistimeseries/redistimeseries.so
